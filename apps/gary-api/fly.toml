# Fly app names are globally unique. If `gary-api` is taken, rename it here and
# update GARY_API_URL in apps/gary-web/fly.toml to match.
app = "gary-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Safe to scale to zero: gary-web reaches this app over Flycast, which routes
  # through Fly's proxy and starts a stopped machine on demand.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
