# Fly app names are globally unique. If `gary-api` is taken, rename it here and
# update GARY_API_URL in apps/gary-web/fly.toml to match.
app = "gary-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Where password reset links point. Must be gary-web's public URL: this one
  # goes in an email and is opened by a person, not by a server.
  WEB_BASE_URL = "https://gary-web.fly.dev"

[deploy]
  # Runs once, before the new version takes traffic, so the schema is never
  # behind the code that expects it. This gates deploys on reaching the
  # database — which is intended, but means an unset DATABASE_URL blocks them.
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  # Safe to scale to zero: gary-web reaches this app over Flycast, which routes
  # through Fly's proxy and starts a stopped machine on demand.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
