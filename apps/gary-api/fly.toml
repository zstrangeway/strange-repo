# Fly app names are globally unique. If `gary-api` is taken, rename it here and
# update GARY_API_URL in apps/gary-web/fly.toml to match.
app = "gary-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Which providers this deployment offers, in the order the sign-in page
  # shows them. Apple is implemented but left out until its credentials
  # exist — an unconfigured provider would still be offered a button, and
  # clicking it would fail. Add "apple" here the same day its secrets are set.
  IDENTITY_PROVIDERS = "google,facebook"

  # gary-web runs in the browser, so it calls this API from the page rather
  # than from a server of its own. Without its origin here the browser makes
  # the request and then refuses to hand over the answer.
  BROWSER_ORIGINS = "https://gary-web.fly.dev"

[deploy]
  # Runs once, before the new version takes traffic, so the schema is never
  # behind the code that expects it. This gates deploys on reaching the
  # database — which is intended, but means an unset DATABASE_URL blocks them.
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  # Safe to scale to zero: every call arrives through Fly's public proxy,
  # which starts a stopped machine on demand and holds the request while it
  # boots. Not Flycast — gary-web is a static app and the caller is somebody's
  # browser, so nothing reaches this over the private network.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
