version: '3'

tasks:
  dev:
    desc: Run the development server with reload
    cmds:
      - uv run fastapi dev src/gary_api/app.py

  serve:
    desc: Run the production server
    cmds:
      - uv run fastapi run src/gary_api/app.py

  migrate:
    desc: Apply database migrations
    cmds:
      - uv run alembic upgrade head

  seed:
    desc: Create or reset the local development accounts
    deps: [migrate]
    cmds:
      - uv run gary-api-seed

  revision:
    desc: 'Generate a migration from model changes: task gary-api:revision -- "message"'
    cmds:
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  test:
    desc: Run the specs and unit tests, then enforce the coverage gate
    env:
      # Pinned, not merely defaulted: a real RESEND_API_KEY in the environment
      # would otherwise select Resend and turn a spec run into real email sent
      # to real people. Specs assert on what the console provider logged.
      MAIL_PROVIDER: console
    cmds:
      - uv run coverage erase
      - uv run coverage run -m behave
      - uv run coverage run -a -m unittest discover -s tests
      - uv run coverage report
