[project]
name = "gary-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
gary-api = "gary_api:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "coverage>=7.15.4",
]

[tool.coverage.run]
source = ["src/gary_api"]
branch = true

[tool.coverage.report]
show_missing = true
