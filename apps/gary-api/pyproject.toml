[project]
name = "gary-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    # Already present under fastapi[standard]; named here because the mail
    # providers call it directly rather than inheriting it by luck.
    "httpx>=0.28.1",
    # Google and Facebook, behind one interface. Apple is not in its provider
    # list, which is why gary_api/identity/apple.py exists.
    "httpx-oauth>=0.17.0",
    # The narrator talks to OpenRouter, which serves an OpenAI-compatible API
    # and no Anthropic one — so this is the client even though the model on the
    # other end is usually a Claude. Owning the SSE framing, the fragmented
    # tool-call arguments and the retries ourselves is the part most likely to
    # be subtly wrong.
    "openai>=2.53.0",
    # Signs Apple's client secret (ES256) and verifies its id_token.
    "pyjwt[crypto]>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.51",
]

[project.scripts]
gary-api = "gary_api:main"
gary-api-seed = "gary_api.seed:main"
gary-api-smoke = "gary_api.smoke:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "coverage>=7.15.4",
]

[tool.coverage.run]
source = ["src/gary_api"]
branch = true
# SQLAlchemy's async layer hands control to greenlets, and behave drives the
# app through a worker thread. Without both, every line after an await on the
# database reads as uncovered while the specs exercising it pass.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
fail_under = 100
