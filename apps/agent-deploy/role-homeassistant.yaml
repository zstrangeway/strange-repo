# Rights for apps/homeassistant. No secrets, no delete, no cluster scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperclip-agent-deploy
  namespace: homeassistant
rules:
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch]
