# https://homepage.strange-lab.dev, through apps/proxy (Traefik), which holds
# the wildcard certificate. The name must also be in HOMEPAGE_ALLOWED_HOSTS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
spec:
  ingressClassName: traefik
  rules:
    - host: homepage.strange-lab.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port: {name: http}
