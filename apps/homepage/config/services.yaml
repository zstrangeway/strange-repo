- Infrastructure:
    - UniFi:
        href: https://unifi.strange-lab.dev
        description: UDM - network and Wi-Fi
        icon: unifi.svg
        widget:
          type: unifi
          url: "{{HOMEPAGE_VAR_UNIFI_URL}}"
          key: "{{HOMEPAGE_VAR_UNIFI_KEY}}"
          fields: [uptime, wan, lan_users, wlan_users]
    - Proxmox:
        href: https://proxmox.strange-lab.dev
        description: ThinkCentre M710s
        icon: proxmox.svg
        widget:
          type: proxmox
          url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          node: pve

# Read straight from Prometheus inside the cluster - no credentials needed.
# Each query is "or vector(0)" where nothing-to-report would otherwise read as
# no data rather than as 0.
- Monitoring:
    - Grafana:
        href: https://grafana.strange-lab.dev/dashboards
        description: Cluster health at a glance
        icon: grafana.svg
        widget:
          type: prometheusmetric
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
          refreshInterval: 30000
          metrics:
            - label: Alerts firing
              query: count(ALERTS{alertstate="firing", alertname!~"Watchdog|InfoInhibitor"}) or vector(0)
            - label: Pods not running
              query: sum(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"}) or vector(0)
            - label: Restarts (24h)
              query: round(sum(increase(kube_pod_container_status_restarts_total[24h]))) or vector(0)
            - label: Fullest disk
              query: round(max(100 * (1 - node_filesystem_avail_bytes{mountpoint="/var"} / node_filesystem_size_bytes{mountpoint="/var"})))
              format:
                type: number
                suffix: "%"
    - Prometheus:
        href: https://grafana.strange-lab.dev/explore
        description: Scrape targets
        icon: prometheus.svg
        widget:
          type: prometheus
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
    - Proxmox storage:
        href: https://proxmox.strange-lab.dev
        description: When local-lvm fills, every VM freezes
        icon: proxmox.svg
        widget:
          type: prometheusmetric
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
          refreshInterval: 60000
          metrics:
            - label: local-lvm (VM disks)
              query: round(100 * pve_disk_usage_bytes{id="storage/pve/local-lvm"} / pve_disk_size_bytes{id="storage/pve/local-lvm"})
              format: {type: number, suffix: "%"}
            - label: local (host)
              query: round(100 * pve_disk_usage_bytes{id="storage/pve/local"} / pve_disk_size_bytes{id="storage/pve/local"})
              format: {type: number, suffix: "%"}

- Agents:
    - Paperclip:
        href: https://paperclip.strange-lab.dev
        description: The agent team
        icon: mdi-paperclip
