# Needs metrics-server in the cluster, even with cpu and memory off: without
# it the widget errors on every refresh.
- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: homelab
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true
- datetime:
    text_size: md
    format:
      dateStyle: long
      timeStyle: short
