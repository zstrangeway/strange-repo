# Traefik: HTTPS for the homelab's apps at *.strange-lab.dev, with a
# Let's Encrypt wildcard certificate proved through Cloudflare DNS. Private:
# the names only exist in the UDM (apps/dns) and over Tailscale split DNS.
# `task test` fails on a key the chart doesn't define.

service:
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.233

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      tls:
        enabled: true
        # letsencrypt-staging (kept below) first, for anything that changes
        # how certificates are obtained: production's rate limits can lock
        # issuance out for days.
        certResolver: letsencrypt
        # One wildcard for every app, so app names stay out of the public
        # certificate-transparency logs - only strange-lab.dev shows.
        domains:
          - main: strange-lab.dev
            sans: ["*.strange-lab.dev"]

certificatesResolvers:
  letsencrypt-staging:
    acme:
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      storage: /data/acme-staging.json
      dnsChallenge:
        provider: cloudflare
        # Check the challenge record against public resolvers, not the UDM.
        resolvers: ["1.1.1.1:53", "1.0.0.1:53"]
  letsencrypt:
    acme:
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers: ["1.1.1.1:53", "1.0.0.1:53"]

# From `secret:cloudflare-token`: DNS edit on strange-lab.dev only.
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef: {name: cloudflare-token, key: token}

# Where the certificates live, so a restart doesn't re-request them.
persistence:
  enabled: true
  storageClass: local-path
  size: 128Mi

deployment:
  initContainers:
    # Traefik refuses an acme.json readable by anyone else.
    - name: acme-permissions
      image: busybox:1.37
      command: ["sh", "-c", "touch /data/acme.json /data/acme-staging.json && chmod 600 /data/acme.json /data/acme-staging.json"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: data, mountPath: /data}

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

providers:
  kubernetesIngress:
    # Ingresses get Traefik's LoadBalancer IP in their status, which is what
    # apps/dns reads to point each name at .233.
    publishedService:
      enabled: true

# Scraped by apps/monitoring.
metrics:
  prometheus:
    serviceMonitor:
      enabled: true

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}

# A route of Traefik's own on HTTPS: certificates are requested for routes,
# so the wildcard is issued (and renewed, and checked by deploy) even before
# any app routes here. https://probe.strange-lab.dev/ping answers OK.
ingressRoute:
  healthcheck:
    enabled: true
    entryPoints: [websecure]
    matchRule: Host(`probe.strange-lab.dev`) && PathPrefix(`/ping`)

# Appliances on the LAN behind the same wildcard: Proxmox and the UDM.
# Each is a Service with no pods - an EndpointSlice points it at the device -
# and an Ingress, so apps/dns names it like any app. Both devices serve
# self-signed HTTPS, which Traefik accepts on these two routes only (the
# backend-selfsigned ServersTransport); browsers see the wildcard.
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: ServersTransport
    metadata: {name: backend-selfsigned, namespace: proxy}
    spec:
      insecureSkipVerify: true
  - apiVersion: v1
    kind: Service
    metadata:
      name: proxmox
      namespace: proxy
      annotations:
        traefik.ingress.kubernetes.io/service.serversscheme: https
        traefik.ingress.kubernetes.io/service.serverstransport: proxy-backend-selfsigned@kubernetescrd
    spec:
      ports: [{name: https, port: 8006, targetPort: 8006}]
  - apiVersion: discovery.k8s.io/v1
    kind: EndpointSlice
    metadata:
      name: proxmox
      namespace: proxy
      labels: {kubernetes.io/service-name: proxmox}
    addressType: IPv4
    ports: [{name: https, port: 8006, protocol: TCP}]
    endpoints:
      - addresses: [192.168.1.200]
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: proxmox
      namespace: proxy
    spec:
      ingressClassName: traefik
      rules:
        - host: proxmox.strange-lab.dev
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: proxmox
                    port: {name: https}
  - apiVersion: v1
    kind: Service
    metadata:
      name: unifi
      namespace: proxy
      annotations:
        traefik.ingress.kubernetes.io/service.serversscheme: https
        traefik.ingress.kubernetes.io/service.serverstransport: proxy-backend-selfsigned@kubernetescrd
    spec:
      ports: [{name: https, port: 443, targetPort: 443}]
  - apiVersion: discovery.k8s.io/v1
    kind: EndpointSlice
    metadata:
      name: unifi
      namespace: proxy
      labels: {kubernetes.io/service-name: unifi}
    addressType: IPv4
    ports: [{name: https, port: 443, protocol: TCP}]
    endpoints:
      - addresses: [192.168.1.1]
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: unifi
      namespace: proxy
    spec:
      ingressClassName: traefik
      rules:
        - host: unifi.strange-lab.dev
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: unifi
                    port: {name: https}
