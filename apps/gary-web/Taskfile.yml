version: '3'

tasks:
  dev:
    desc: Run the development server
    cmds:
      - pnpm exec next dev

  build:
    desc: Build for production
    cmds:
      - pnpm exec next build

  serve:
    desc: Run the production server
    cmds:
      - pnpm exec next start

  lint:
    desc: Lint the app, and fail on a warning
    cmds:
      # --max-warnings 0, or this reports and passes. Every rule here is a
      # warning rather than an error, so without it the whole run is advisory
      # and a warning sits in the tree until somebody happens to look. One
      # did: a useEffect flagged for months while `pnpm test` stayed green,
      # because nothing ran this.
      # From the workspace root, where the shared config lives — see
      # eslint.config.mjs there. Scoped to this app so `pnpm --filter
      # gary-web test` still means this app and not the whole tree.
      - pnpm -w exec eslint apps/gary-web --max-warnings 0

  versions:
    desc: Check every place naming a Node major agrees
    cmds:
      # Cheap and first, because it is the one failure that type-checks
      # clean: types ahead of the runtime compile against APIs that will not
      # be there. @types/node sat at 20 against a node 22 image, then a
      # dependabot bump moved it to 26 against the same image.
      - node scripts/check-node-alignment.mjs

  unit:
    desc: Unit-test src/lib and enforce its coverage gate
    cmds:
      - pnpm exec vitest run --coverage

  test:
    desc: Lint, unit tests, then the Gherkin specs against a real browser
    cmds:
      # First, and part of `test` rather than a job of its own, so it runs
      # wherever the specs run — CI included. It was in neither before, which
      # is how a warning survived.
      - task: versions
      - task: lint
      - task: unit
      - pnpm exec cucumber-js

  test:e2e:
    desc: Run the end-to-end specs against a real gary-api and a throwaway database
    env:
      GARY_E2E: '1'
    cmds:
      - pnpm exec cucumber-js --profile e2e
