# Fly app names are globally unique. If `gary-web` is taken, rename it here.
app = "gary-web"
primary_region = "iad"

[build]
  # Relative to this file, not to the working directory. The build context is
  # still the working directory, which must be the repo root.
  dockerfile = "Dockerfile"

[env]
  # Read on gary-web's server now, never in the browser, so a Fly-private
  # address would work here where it could not before. Left public because
  # this app's history with Flycast is not encouraging and the public URL is
  # known to work; http://gary-api.flycast is the change to try if you want
  # gary-api off the internet. Must match the app name in
  # apps/gary-api/fly.toml either way.
  GARY_API_URL = "https://gary-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
