# Fly app names are globally unique. If `gary-web` is taken, rename it here.
app = "gary-web"
primary_region = "iad"

[build]
  # Relative to this file, not to the working directory. The build context is
  # still the working directory, which must be the repo root.
  dockerfile = "Dockerfile"

[env]
  # Flycast: private to the org, and routed through Fly's proxy so a stopped
  # gary-api machine is started on demand rather than dropping out of DNS.
  # Port 80, not 8080 — [http_service] makes fly-proxy listen on 80/443 and
  # forward to internal_port. 8080 is the app's own socket, which only
  # .internal would reach. Host must match the app name in gary-api's fly.toml.
  GARY_API_URL = "http://gary-api.flycast"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
