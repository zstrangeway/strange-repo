# Fly app names are globally unique. If `gary-web` is taken, rename it here.
app = "gary-web"
primary_region = "iad"

[build]
  # Relative to this file, not to the working directory. The build context is
  # still the working directory, which must be the repo root.
  dockerfile = "Dockerfile"

  [build.args]
    # Build-time, not a secret and not a runtime env var: `next build` inlines
    # NEXT_PUBLIC_ values into the client bundle, and the deploy builds on Fly's
    # remote builder where `fly secrets` do not exist. Setting this as a secret
    # instead would leave browser errors unreported with nothing to show for it.
    NEXT_PUBLIC_SENTRY_DSN = "https://7b033a8fc274f64ab923b550d7706a32@o4511882325655552.ingest.us.sentry.io/4511882329784320"

    # Which project sentry-cli uploads source maps to. Slugs, not the numeric
    # ids in the DSN. Neither is secret; the token that goes with them is, and
    # arrives separately as a build secret from the deploy step.
    SENTRY_ORG = "na-e0z"
    SENTRY_PROJECT = "gary-web"

[env]
  # The same project, read at runtime by the Node and Edge runtimes. Separate
  # from the build arg above because these two are read at different times, not
  # because they are different projects.
  SENTRY_DSN = "https://7b033a8fc274f64ab923b550d7706a32@o4511882325655552.ingest.us.sentry.io/4511882329784320"

  # Read on gary-web's server now, never in the browser, so a Fly-private
  # address would work here where it could not before. Left public because
  # this app's history with Flycast is not encouraging and the public URL is
  # known to work; http://gary-api.flycast is the change to try if you want
  # gary-api off the internet. Must match the app name in
  # apps/gary-api/fly.toml either way.
  # Kept for reference only. gary-web runs in the browser, so the API's
  # address is baked in at build time — see NEXT_PUBLIC_GARY_API_URL in the
  # Dockerfile. Changing it here alone changes nothing.
  NEXT_PUBLIC_GARY_API_URL = "https://gary-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
