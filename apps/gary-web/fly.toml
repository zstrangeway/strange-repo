# Fly app names are globally unique. If `gary-web` is taken, rename it here.
app = "gary-web"
primary_region = "iad"

[build]
  # Relative to this file, not to the working directory. The build context is
  # still the working directory, which must be the repo root.
  dockerfile = "Dockerfile"

[env]
  # The browser fetches this directly, so it must be gary-api's public URL —
  # not a Fly-private address, which a browser cannot route to. fly-proxy
  # starts a stopped machine on a public request, so gary-api still scales to
  # zero. Must match the app name in apps/gary-api/fly.toml.
  GARY_API_URL = "https://gary-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
