version: '3'

env:
  # The homelab repo writes the cluster's kubeconfig here. Set KUBECONFIG to
  # point anywhere else.
  KUBECONFIG: '{{env "KUBECONFIG" | default (print (env "HOME") "/Code/homelab/talos/_out/kubeconfig")}}'

vars:
  CHART: kube-prometheus-stack --repo https://prometheus-community.github.io/helm-charts --version 91.8.2
  RELEASE: monitoring
  GRAFANA: http://192.168.1.231

tasks:
  test:
    desc: Check values against the chart, render it, and have the cluster's API check it if reachable
    cmds:
      - |
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        # The whole chart, not `helm show values`: that leaves out the bundled
        # sub-charts' (grafana, node-exporter, ...) own defaults.
        helm pull {{.CHART}} --untar -d "$tmp"
        yq -o=json values.yaml > "$tmp/ours.json"
        python3 ../../tools/check_helm_values.py monitoring "$tmp/kube-prometheus-stack" "$tmp/ours.json"
      - |
        out=$(helm template {{.RELEASE}} {{.CHART}} -n monitoring -f values.yaml) || { echo "monitoring: helm template failed"; exit 1; }
        n=$(echo "$out" | yq -N 'select(.kind != null) | .kind' | wc -l)
        [ "$n" -gt 0 ] || { echo "monitoring: chart rendered no objects"; exit 1; }
        echo "monitoring: chart renders $n objects"
      # The chart's own resources (Prometheus, Alertmanager, ServiceMonitors,
      # rules) are custom resources, so the API can only check them once the
      # chart's CRDs are installed - i.e. from the second deploy on.
      - |
        if ! kubectl version --request-timeout=3s >/dev/null 2>&1; then
          echo "monitoring: no cluster reachable - schemas NOT checked, only rendering"
        elif ! kubectl get crd prometheuses.monitoring.coreos.com >/dev/null 2>&1; then
          echo "monitoring: CRDs not installed yet - schemas NOT checked, only rendering"
        else
          # --skip-tests: helm test pods aren't installed, and their service
          # accounts don't exist. Server-side apply, because Helm owns these
          # objects and client-side apply wants an annotation Helm doesn't set.
          helm template {{.RELEASE}} {{.CHART}} -n monitoring -f values.yaml --skip-tests |
            kubectl apply --server-side --force-conflicts --field-manager=dry-run-check --dry-run=server -f - >/dev/null
          echo "monitoring: cluster API accepted every object (server-side dry run)"
        fi

  diff:
    desc: Show what deploy would change in the cluster
    cmds:
      - kubectl diff -f namespace.yaml || [ $? -eq 1 ]
      # helm diff can't map the chart's custom resources before their CRDs
      # exist, so the first install lists what it would create instead.
      - |
        if kubectl get crd prometheuses.monitoring.coreos.com >/dev/null 2>&1; then
          helm diff upgrade {{.RELEASE}} {{.CHART}} -n monitoring -f values.yaml --allow-unreleased
        else
          echo "monitoring: not installed yet, so no diff; deploy creates (plus the chart's CRDs):"
          helm template {{.RELEASE}} {{.CHART}} -n monitoring -f values.yaml |
            yq -N 'select(.kind != null) | .kind' | sort | uniq -c | sort -rn
        fi

  secret:grafana-admin:
    desc: Create Grafana's admin login in the cluster, once - never in this repo
    cmds:
      - kubectl apply -f namespace.yaml >/dev/null
      - |
        if kubectl -n monitoring get secret grafana-admin >/dev/null 2>&1; then
          echo "monitoring/grafana-admin: exists, left alone"; exit 0
        fi
        # Generated, piped and stored without being printed.
        kubectl -n monitoring create secret generic grafana-admin \
          --from-literal=admin-user=admin \
          --from-literal=admin-password="$(openssl rand -base64 24)" >/dev/null
        echo "monitoring/grafana-admin: created (user: admin)"
        echo "  read the password: kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d"

  secret:slack-webhook:
    desc: Store the Slack incoming-webhook URL alerts go to, from a hidden prompt
    interactive: true
    cmds:
      - kubectl apply -f namespace.yaml >/dev/null
      - |
        printf 'Slack webhook URL (input hidden): '
        read -rs url; echo
        case "$url" in
          https://hooks.slack.com/services/*) ;;
          *) echo "monitoring: that isn't a https://hooks.slack.com/services/... URL - nothing stored"; exit 1 ;;
        esac
        # Straight into the cluster: never printed, written to disk or committed.
        printf '%s' "$url" | kubectl -n monitoring create secret generic alertmanager-slack \
          --from-file=webhook-url=/dev/stdin --dry-run=client -o yaml |
          kubectl apply --server-side --force-conflicts -f - >/dev/null
        echo "monitoring/alertmanager-slack: stored"

  secret:healthchecks-ping:
    desc: Store the healthchecks.io ping URL Watchdog keeps alive, from a hidden prompt
    interactive: true
    cmds:
      - kubectl apply -f namespace.yaml >/dev/null
      - |
        printf 'healthchecks.io ping URL (input hidden): '
        read -rs url; echo
        case "$url" in
          https://hc-ping.com/*) ;;
          *) echo "monitoring: that isn't a https://hc-ping.com/... URL - nothing stored"; exit 1 ;;
        esac
        printf '%s' "$url" | kubectl -n monitoring create secret generic alertmanager-healthchecks \
          --from-file=ping-url=/dev/stdin --dry-run=client -o yaml |
          kubectl apply --server-side --force-conflicts -f - >/dev/null
        echo "monitoring/alertmanager-healthchecks: stored"

  deploy:
    desc: Install or upgrade the stack, wait for it, and check Prometheus and Grafana work
    preconditions:
      - sh: kubectl -n monitoring get secret alertmanager-healthchecks >/dev/null 2>&1
        msg: "monitoring/alertmanager-healthchecks is missing. In a terminal: pnpm --filter monitoring run secret:healthchecks-ping"
      - sh: kubectl -n monitoring get secret alertmanager-slack >/dev/null 2>&1
        msg: "monitoring/alertmanager-slack is missing. In a terminal: pnpm --filter monitoring run secret:slack-webhook"
      - sh: kubectl -n monitoring get secret grafana-admin >/dev/null 2>&1
        msg: "monitoring/grafana-admin is missing. Run: pnpm --filter monitoring run secret:grafana-admin"
    cmds:
      - kubectl apply -f namespace.yaml
      - helm upgrade --install {{.RELEASE}} {{.CHART}} -n monitoring -f values.yaml --wait --timeout 10m
      - |
        code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 {{.GRAFANA}}/api/health)
        [ "$code" = 200 ] || { echo "monitoring: Grafana at {{.GRAFANA}} answered $code"; exit 1; }
        echo "monitoring: Grafana up at {{.GRAFANA}}"
      # Every target Prometheus scrapes should be up. A down one is either a
      # real problem or a scrape that can't work here and should be switched off.
      # Through the API server's service proxy rather than a port-forward: no
      # background process to wait for or clean up (Task's shell has no kill).
      - |
        sleep 30
        targets=$(kubectl get --raw "/api/v1/namespaces/monitoring/services/{{.RELEASE}}-kube-prometheus-prometheus:http-web/proxy/api/v1/targets?state=active")
        up=$(echo "$targets" | jq '[.data.activeTargets[] | select(.health == "up")] | length')
        down=$(echo "$targets" | jq -r '[.data.activeTargets[] | select(.health != "up") | .labels.job + " (" + .lastError + ")"] | join("; ")')
        [ -z "$down" ] || { echo "monitoring: $up targets up, but down: $down"; exit 1; }
        echo "monitoring: Prometheus scraping $up targets, all up"
