# kube-prometheus-stack, trimmed for one small homelab cluster. Anything not
# set here is the chart's default. `task test` fails on a key the chart
# doesn't have, since Helm ignores those silently.

# Talos binds these four to localhost, so Prometheus can't scrape them; on,
# they show as down and alert from day one. Exposing them is a Talos patch in
# the homelab repo if they're ever wanted.
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
    windows: false

prometheus:
  prometheusSpec:
    retention: 7d
    # Below the volume's 10Gi, so Prometheus prunes before the disk fills.
    retentionSize: 8GB
    # Pick up ServiceMonitors, PodMonitors, Probes and rules from any
    # namespace, not only ones labelled for this release - apps bring their own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          # local-path: pinned to one node, gone with its disk. A week of
          # metrics is worth that trade.
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 10Gi}

alertmanager:
  alertmanagerSpec:
    # From `secret:slack-webhook` and `secret:healthchecks-ping`; each mounted
    # at /etc/alertmanager/secrets/<name>/.
    secrets: [alertmanager-slack, alertmanager-healthchecks]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
  config:
    route:
      receiver: slack
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog always fires. Re-sending it every minute pings
        # healthchecks.io, which alerts in Slack itself when the pings stop -
        # i.e. when this cluster, the host, the network or power is down,
        # none of which anything in here can report.
        - matchers: ['alertname = "Watchdog"']
          receiver: healthchecks
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        # Only mutes info-level alerts; nothing to send.
        - matchers: ['alertname = "InfoInhibitor"']
          receiver: "null"
    inhibit_rules:
      # A critical alert mutes the warning version of the same thing.
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: [alertname, namespace]
    receivers:
      - name: "null"
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/ping-url
            send_resolved: false
      - name: slack
        slack_configs:
          # The URL picks the channel, so there's no `channel` here.
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}:red_circle:{{ else }}:large_green_circle:{{ end }} {{ .CommonLabels.alertname }}{{ if .CommonLabels.namespace }} in {{ .CommonLabels.namespace }}{{ end }}'
            text: |-
              {{ range .Alerts }}*{{ .Labels.severity | toUpper }}* {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

grafana:
  # From `task secret:grafana-admin`; never in this repo.
  admin:
    existingSecret: grafana-admin
  service:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 192.168.1.231
      # Written into the UDM's DNS by apps/dns.
      external-dns.kubernetes.io/hostname: grafana.home.arpa
    port: 80
  # https://grafana.strange-lab.dev through apps/proxy, which holds the
  # wildcard certificate. apps/dns points the name at Traefik.
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.strange-lab.dev]
  grafana.ini:
    server:
      # Grafana itself speaks plain http behind Traefik; links and redirects
      # it generates must say https.
      root_url: https://grafana.strange-lab.dev
  # Dashboards and datasources come from the chart and from ConfigMaps, so
  # nothing in Grafana's own database needs to survive a restart.
  persistence:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# The Proxmox host itself - nothing else here sees it. prometheus-pve-exporter
# reads Proxmox's API with a read-only token (observer@pve!monitoring), issued
# into monitoring/proxmox-token by the homelab repo's
# `task secret:proxmox-token APP=monitoring`.
extraManifests:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: pve-exporter
      namespace: monitoring
      labels: {app.kubernetes.io/name: pve-exporter}
    spec:
      replicas: 1
      selector:
        matchLabels: {app.kubernetes.io/name: pve-exporter}
      template:
        metadata:
          labels: {app.kubernetes.io/name: pve-exporter}
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: pve-exporter
              image: prompve/prometheus-pve-exporter:3.10.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                # The token's id is observer@pve!monitoring: user, then name.
                - {name: PVE_USER, value: observer@pve}
                - {name: PVE_TOKEN_NAME, value: monitoring}
                - name: PVE_TOKEN_VALUE
                  valueFrom: {secretKeyRef: {name: proxmox-token, key: token-secret}}
                # Proxmox's certificate is self-signed. The token is read-only.
                - {name: PVE_VERIFY_SSL, value: "false"}
              ports:
                - {name: http, containerPort: 9221}
              readinessProbe:
                tcpSocket: {port: http}
              resources:
                requests: {cpu: 10m, memory: 48Mi}
                limits: {memory: 128Mi}
              # Read-only root, but Python won't start without a writable /tmp.
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {medium: Memory, sizeLimit: 16Mi}
  - apiVersion: v1
    kind: Service
    metadata:
      name: pve-exporter
      namespace: monitoring
      labels: {app.kubernetes.io/name: pve-exporter}
    spec:
      selector: {app.kubernetes.io/name: pve-exporter}
      ports:
        - {name: http, port: 9221, targetPort: http}
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: pve-exporter
      namespace: monitoring
    spec:
      selector:
        matchLabels: {app.kubernetes.io/name: pve-exporter}
      endpoints:
        - port: http
          path: /pve
          params:
            target: [192.168.1.200]
            cluster: ["1"]
            node: ["1"]
          interval: 60s
          scrapeTimeout: 30s

additionalPrometheusRulesMap:
  proxmox:
    groups:
      - name: proxmox
        rules:
          # local-lvm is a thin pool: when it fills, every VM on it freezes
          # at once. Warn early, page before it's too late.
          - alert: ProxmoxStorageFilling
            expr: 100 * pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"} > 80
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: 'Proxmox storage {{ $labels.id }} is {{ $value | humanize }}% full.'
              description: 'Over 80% for 15 minutes. local-lvm full means every VM freezes.'
          - alert: ProxmoxStorageFilling
            expr: 100 * pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"} > 90
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: 'Proxmox storage {{ $labels.id }} is {{ $value | humanize }}% full.'
              description: 'Over 90%. Free space now: local-lvm full means every VM freezes.'
          - alert: ProxmoxExporterDown
            # Whether any exporter works, not each pod: a replaced pod's last
            # "down" would otherwise alert on its own.
            expr: max(up{job="pve-exporter"}) == 0 or absent(up{job="pve-exporter"})
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: 'Not getting metrics from the Proxmox host.'
              description: 'pve-exporter has been down or unscraped for 10 minutes; storage alerts are blind meanwhile.'
          - alert: ProxmoxGuestDown
            expr: pve_up{id=~"qemu/.*|lxc/.*"} == 0 and on(id) pve_onboot_status == 1
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: 'Proxmox guest {{ $labels.id }} is stopped but set to start on boot.'
              description: 'Stopped for 5 minutes.'
