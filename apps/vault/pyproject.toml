[project]
name = "vault-sync"
version = "0.1.0"
description = "Keeps the homelab agents' memory in the vault repository"
readme = "README.md"
requires-python = ">=3.13"
# Standard library only: it drives the git command line, which the image has.
dependencies = []

[project.scripts]
vault-sync = "vault_sync.sync:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "coverage>=7.15.4",
    "ruff>=0.15.0",
]

[tool.coverage.run]
source = ["src/vault_sync"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 120
