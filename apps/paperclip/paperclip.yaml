# Agent workspaces, uploads and Paperclip's own files.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperclip-home
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
spec:
  replicas: 1
  # One pod at a time: its volume can only be mounted by one.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: paperclip}
  template:
    metadata:
      labels: {app.kubernetes.io/name: paperclip}
    spec:
      # Straight in as the image's node user: the entrypoint execs directly
      # when not root, so no chown/gosu step needs root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: paperclip
          image: ghcr.io/paperclipai/paperclip:2026.916.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: HOST, value: 0.0.0.0}
            - {name: PORT, value: "3100"}
            - {name: SERVE_UI, value: "true"}
            - {name: PAPERCLIP_HOME, value: /paperclip}
            - {name: PAPERCLIP_DEPLOYMENT_MODE, value: authenticated}
            - {name: PAPERCLIP_DEPLOYMENT_EXPOSURE, value: private}
            # HTTPS through apps/proxy. Paperclip's composer and GitHub connection
            # card both need a secure origin - on plain http they silently do nothing.
            - {name: PAPERCLIP_PUBLIC_URL, value: https://paperclip.strange-lab.dev}
            # Private mode refuses any Host it doesn't know (403). These are what
            # a browser sends; localhost is always allowed, which the probes use.
            - {name: PAPERCLIP_ALLOWED_HOSTNAMES, value: "paperclip.strange-lab.dev,paperclip.home.arpa,192.168.1.232"}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: paperclip-internal, key: postgres-password}}
            - {name: DATABASE_URL, value: "postgres://paperclip:$(POSTGRES_PASSWORD)@postgres:5432/paperclip"}
            - name: BETTER_AUTH_SECRET
              valueFrom: {secretKeyRef: {name: paperclip-internal, key: better-auth-secret}}
            - name: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
              valueFrom: {secretKeyRef: {name: paperclip-internal, key: tool-action-signing-secret}}
            # Encrypts the secrets agents are given. In a Secret rather than
            # left to a file on the volume, so losing the volume doesn't make
            # every stored secret unreadable.
            - name: PAPERCLIP_SECRETS_MASTER_KEY
              valueFrom: {secretKeyRef: {name: paperclip-internal, key: secrets-master-key}}
          # Model keys: claude_local reads ANTHROPIC_API_KEY, opencode_local
          # OPENROUTER_API_KEY. Optional - a key that isn't set yet is just a
          # missing prerequisite Paperclip reports, not a crash.
          envFrom:
            - secretRef: {name: paperclip-model-keys, optional: true}
          ports:
            - {name: http, containerPort: 3100}
          # Host: localhost - by pod IP, the private-host guard answers 403.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          # Agents run in here (Claude Code, OpenCode), so it needs real room.
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 3Gi}
          volumeMounts:
            - {name: home, mountPath: /paperclip}
      volumes:
        - name: home
          persistentVolumeClaim: {claimName: paperclip-home}
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.232
    # Written into the UDM's DNS by apps/dns.
    external-dns.kubernetes.io/hostname: paperclip.home.arpa
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/name: paperclip}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# https://paperclip.strange-lab.dev, through apps/proxy (Traefik), which
# holds the wildcard certificate. apps/dns points the name at Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperclip
spec:
  ingressClassName: traefik
  rules:
    - host: paperclip.strange-lab.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperclip
                port: {name: http}
