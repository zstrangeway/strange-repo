apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17.11
          env:
            - {name: POSTGRES_USER, value: paperclip}
            - {name: POSTGRES_DB, value: paperclip}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: paperclip-internal, key: postgres-password}}
            # A subdirectory: the volume's root isn't empty (lost+found etc.),
            # which initdb refuses.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, paperclip, -d, paperclip]}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # local-path: pinned to one node, and gone with its disk. Back up
        # anything in here that matters.
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
