# Managed in git, like the rest of the homelab: edit it here and redeploy,
# and the pod rolls with the new ConfigMap. Everything Home Assistant writes
# itself (users, UI-configured integrations, the recorder database) lives
# beside this file on the volume in /config.
default_config:

# No `http:` block here, on purpose. Since 2026.8 Home Assistant keeps its
# HTTP server settings (trusted proxies among them) in its own store at
# /config/.storage/http; a YAML `http:` block is imported only as a five-
# minute trial and then reverted unconfirmed, and it breaks entirely in
# 2027.2. Those settings live in config/http.json instead, seeded onto the
# volume at every pod start - that file is where trusted_proxies is set.
