version: '3'

env:
  # The homelab repo writes the cluster's kubeconfig here. Set KUBECONFIG to
  # point anywhere else.
  KUBECONFIG: '{{env "KUBECONFIG" | default (print (env "HOME") "/Code/homelab/talos/_out/kubeconfig")}}'

vars:
  URL: https://home.strange-lab.dev

tasks:
  test:
    desc: Render the manifests, parse the config, and have the cluster's API check them if it is reachable
    cmds:
      - |
        n=$(kubectl kustomize . | yq -N 'select(.kind != null) | .kind' | wc -l)
        echo "homeassistant: rendered $n objects"
      - |
        yq -e '.' config/configuration.yaml >/dev/null || { echo "homeassistant: config/configuration.yaml is not valid YAML"; exit 1; }
        echo "homeassistant: parsed config/configuration.yaml"
      # The schema check needs a cluster to ask. Without one it says it was
      # skipped rather than passing quietly.
      - |
        if ! kubectl version --request-timeout=3s >/dev/null 2>&1; then
          echo "homeassistant: no cluster reachable - schemas NOT checked, only rendering and YAML"
        elif ! kubectl get namespace homeassistant >/dev/null 2>&1; then
          echo "homeassistant: namespace not created yet - schemas NOT checked, only rendering and YAML"
        else
          kubectl apply -k . --dry-run=server >/dev/null
          echo "homeassistant: cluster API accepted every object (server-side dry run)"
        fi

  diff:
    desc: Show what deploy would change in the cluster
    cmds:
      # kubectl diff exits 1 when there is a difference; only >1 is an error.
      - kubectl diff -k . || [ $? -eq 1 ]

  deploy:
    desc: Apply to the cluster, wait for the rollout, and check it answers
    cmds:
      - kubectl apply -k .
      # 5m: the first rollout pulls a large image and then installs Python
      # dependencies before it answers.
      - kubectl -n homeassistant rollout status deploy/homeassistant --timeout 5m
      # Retried: rollout status reports ready a moment before the Service
      # routes to the new pod, so the first try can be refused outright.
      - |
        for i in $(seq 1 10); do
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 {{.URL}}/ || true)
          [ "$code" = 200 ] && break
          sleep 3
        done
        [ "$code" = 200 ] || { echo "homeassistant: {{.URL}}/ answered ${code:-nothing} after 10 tries"; exit 1; }
        echo "homeassistant: up at {{.URL}}"
