name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy that is already in flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Fly organisation the apps live in. `personal` is the default org on a
  # individual account; change it if yours is named otherwise.
  FLY_ORG: personal

jobs:
  test-api:
    name: gary-api specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gary-api test

  test-web:
    name: gary-web specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gary-web exec playwright install --with-deps chromium
      - run: pnpm --filter gary-web test

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gary-api image
        run: docker build -f apps/gary-api/Dockerfile -t gary-api:ci apps/gary-api
      - name: Build gary-web image
        run: docker build -f apps/gary-web/Dockerfile -t gary-web:ci .

  deploy-api:
    name: Deploy gary-api
    needs: [test-api, test-web, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Idempotent: creates the app on the first run, no-ops afterwards.
      - name: Ensure the Fly app exists
        run: flyctl apps list | grep -qw gary-api || flyctl apps create gary-api --org "$FLY_ORG"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # gary-web resolves gary-api.flycast, which only exists once a private
      # address is allocated. Idempotent: allocates on the first run only.
      # Match address rows only — `ips list` prints a footer mentioning
      # "private", which a whole-output grep matches even when none exists.
      - name: Ensure a Flycast address exists
        run: |
          if flyctl ips list -a gary-api | grep -E '^[[:space:]]*v6[[:space:]]' | grep -qi private; then
            echo "Flycast address already allocated."
          else
            echo "No private address found; allocating one."
            flyctl ips allocate-v6 --private -a gary-api
          fi
          flyctl ips list -a gary-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Run from the app directory so fly.toml and the Dockerfile are both
      # found relative to it, with no path flags to resolve ambiguously.
      - run: flyctl deploy --remote-only
        working-directory: apps/gary-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    name: Deploy gary-web
    # Sequential: gary-web reads gary-api at request time, so the API should be
    # on the new revision first.
    needs: [deploy-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Idempotent: creates the app on the first run, no-ops afterwards.
      - name: Ensure the Fly app exists
        run: flyctl apps list | grep -qw gary-web || flyctl apps create gary-web --org "$FLY_ORG"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Runs from the repo root: the build context must be the whole workspace,
      # so the config path is given relative to it and cannot be read any
      # other way.
      - run: flyctl deploy --config apps/gary-web/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
