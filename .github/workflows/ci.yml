name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    name: gary-api specs
    runs-on: ubuntu-latest
    services:
      # The specs exercise a real connection rather than a stubbed one, so the
      # healthy and unreachable paths are both genuine.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gary-api test

  test-ui:
    name: gary-ui checks
    # Its own job because nothing ran these at all. gary-web's job lints and
    # tests gary-web; packages/ui was reached only incidentally, by `next
    # build` type-checking what it imports in the image job — which is after
    # the gate and says nothing about lint.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gary/ui test

  test-web:
    name: gary-web specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gary-web exec playwright install --with-deps chromium
      - run: pnpm --filter gary-web test

  test-scout:
    name: scout specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # No database and no browser: the specs drive the CLI and a real MCP
      # server subprocess, and the provider is stubbed.
      - run: pnpm --filter scout test

  test-vault:
    name: vault-sync specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Real git repositories in a temp dir: the runner's git is all it needs.
      - run: pnpm --filter vault test

  e2e:
    name: End-to-end specs
    runs-on: ubuntu-latest
    services:
      # The e2e run creates its own throwaway database on this server and
      # drops it afterwards, so nothing here is shared between scenarios.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # gary-web's e2e run boots the real gary-api, so it needs both toolchains.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gary-web exec playwright install --with-deps chromium
      - run: pnpm --filter gary-web test:e2e

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gary-api image
        run: docker build -f apps/gary-api/Dockerfile -t gary-api:ci apps/gary-api
      - name: Build gary-web image
        run: docker build -f apps/gary-web/Dockerfile -t gary-web:ci .
