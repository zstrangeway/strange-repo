name: CI

# Every branch, so work is checked before it reaches a pull request. Check runs
# attach to the commit, so they still surface on the PR without a second run.
on:
  push:
  # Lets a staging deploy be triggered from any branch, without merging first.
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy this branch to staging once checks pass
        type: boolean
        default: true

# A newer push to a PR branch makes the in-flight run irrelevant, but a run on
# main may be mid-deploy — cancelling that would leave a half-rolled release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: example-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same script names documented in CLAUDE.md, so CI fails if that
      # interface drifts.
      - run: pnpm --filter example-web lint
      - run: pnpm --filter example-web typecheck
      - run: pnpm --filter example-web test
      - run: pnpm --filter example-web build

  api:
    name: example-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/example-api/uv.lock

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter example-api bootstrap

      - run: pnpm --filter example-api lint
      - run: pnpm --filter example-api typecheck
      - run: pnpm --filter example-api test

      # Formatting is enforced in CI only; `pnpm format` rewrites in place.
      - name: Check formatting
        working-directory: apps/example-api
        run: uv run ruff format --check .

  images:
    name: build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [example-web, example-api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — Fly builds and stores its own image at deploy time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8080:8080 ${{ matrix.app }}:${{ github.sha }}
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::${{ matrix.app }} did not become healthy (last status: $code)"
            docker logs smoke
            exit 1
          fi
          echo "${{ matrix.app }} healthy"
          docker rm -f smoke

  deploy-staging:
    name: deploy staging
    # Nothing ships until both suites and both images are green.
    needs: [web, api, images]
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://zs-example-web-staging.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # These files were hand-written and cannot be checked locally (fly.io is
      # unreachable from the authoring sandbox), so let flyctl's own parser be
      # the judge before anything is created or deployed.
      - name: Validate Fly config
        run: |
          for cfg in apps/example-api/fly.staging.toml apps/example-web/fly.staging.toml; do
            echo "== $cfg"
            flyctl config validate --config "$cfg"
          done

      # Idempotent, so the only manual setup is a Fly account and a token —
      # the apps themselves get created on first deploy.
      - name: Ensure Fly apps exist
        run: |
          for app in zs-example-api-staging zs-example-web-staging; do
            if flyctl status --app "$app" >/dev/null 2>&1; then
              echo "$app already exists"
            else
              echo "creating $app"
              flyctl apps create "$app" --org "$FLY_ORG"
            fi
          done

      # Deployed from the repo root: the Dockerfiles need pnpm-lock.yaml and
      # pnpm-workspace.yaml, so the build context cannot be the app directory.
      # --config and --dockerfile are resolved relative to that root.
      - name: Deploy example-api
        run: |
          flyctl deploy . \
            --config apps/example-api/fly.staging.toml \
            --dockerfile apps/example-api/Dockerfile \
            --remote-only

      - name: Deploy example-web
        run: |
          flyctl deploy . \
            --config apps/example-web/fly.staging.toml \
            --dockerfile apps/example-web/Dockerfile \
            --remote-only

      - name: Verify staging is serving
        run: |
          ./scripts/smoke.sh \
            https://zs-example-api-staging.fly.dev \
            https://zs-example-web-staging.fly.dev

  deploy-production:
    name: deploy production
    needs: [deploy-staging]
    # Production only ever ships from main — never from a manual branch run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Approval gate lives on this GitHub Environment, not in this file.
    environment:
      name: production
      url: https://zs-example-web.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly config
        run: |
          for cfg in apps/example-api/fly.toml apps/example-web/fly.toml; do
            echo "== $cfg"
            flyctl config validate --config "$cfg"
          done

      - name: Ensure Fly apps exist
        run: |
          for app in zs-example-api zs-example-web; do
            if flyctl status --app "$app" >/dev/null 2>&1; then
              echo "$app already exists"
            else
              echo "creating $app"
              flyctl apps create "$app" --org "$FLY_ORG"
            fi
          done

      - name: Deploy example-api
        run: |
          flyctl deploy . \
            --config apps/example-api/fly.toml \
            --dockerfile apps/example-api/Dockerfile \
            --remote-only

      - name: Deploy example-web
        run: |
          flyctl deploy . \
            --config apps/example-web/fly.toml \
            --dockerfile apps/example-web/Dockerfile \
            --remote-only

      - name: Verify production is serving
        run: |
          ./scripts/smoke.sh \
            https://zs-example-api.fly.dev \
            https://zs-example-web.fly.dev
