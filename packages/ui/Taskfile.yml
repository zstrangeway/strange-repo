version: '3'

tasks:
  lint:
    desc: Lint the components, and fail on a warning
    cmds:
      # The config is the workspace root's, and this runs from there, because
      # eslint will not lint a file outside its config's base path. Run from
      # anywhere below it this answered "File ignored because outside of base
      # path" for every file here — as a *warning*, so it exited 0 having
      # linted none of them, which is the failure mode this repo keeps finding.
      - pnpm -w exec eslint packages/ui --max-warnings 0
      # Says how many, so a run that linted nothing cannot read like a pass.
      - 'echo "@gary/ui: linted $(ls src/components/*.tsx src/hooks/*.ts src/lib/*.ts 2>/dev/null | wc -l) files with the workspace config"'

  typecheck:
    desc: Type-check the components
    cmds:
      - pnpm exec tsc --noEmit
      - 'echo "@gary/ui: type-checked $(ls src/components/*.tsx | wc -l) components and $(ls src/lib/*.ts | wc -l) lib file(s)"'

  test:
    desc: Lint, type-check, and say where these components' behaviour is covered
    cmds:
      - task: lint
      - task: typecheck
      # Named rather than left blank. A `test` task that exits 0 having run
      # nothing reads exactly like a suite that passed.
      - 'echo "@gary/ui: no unit tests here by design — these are presentational components with no logic of their own. What they render is covered end to end by gary-web (pnpm --filter gary-web test)."'
