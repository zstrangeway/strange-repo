version: '3'

tasks:
  lint:
    desc: Say that these components are not linted, and why
    cmds:
      # Nothing lints this package. gary-web's eslint cannot reach it — the
      # files sit outside its config's base path and it refuses them by name
      # — and giving this package a config of its own means an eslint of its
      # own, which is a dependency to discuss rather than one to add quietly.
      #
      # Said out loud rather than left as a missing script. A lint task that
      # exits 0 having linted nothing is indistinguishable from one that
      # passed. Before this the script was worse than either: it named a task
      # that did not exist, so it failed on sight and nobody had run it.
      - 'echo "@gary/ui: NOT LINTED. No eslint here, and gary-web cannot lint outside its own base path. See BACKLOG.md."'


  typecheck:
    desc: Type-check the components
    cmds:
      - pnpm exec tsc --noEmit
      - 'echo "@gary/ui: type-checked $(ls src/components/*.tsx | wc -l) components and $(ls src/lib/*.ts | wc -l) lib file(s)"'

  test:
    desc: Type-check, and say where these components' behaviour is actually covered
    cmds:
      - task: typecheck
      # Named rather than left blank. A `test` task that exits 0 having run
      # nothing reads exactly like a suite that passed.
      - 'echo "@gary/ui: no unit tests here by design — these are presentational components with no logic of their own. What they render is covered end to end by gary-web (pnpm --filter gary-web test)."'
